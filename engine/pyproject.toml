[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "noid-ai-engine"
version = "0.1.0"
description = "Optional authenticated HTTP/SSE engine for NOID AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["noid_engine*"]
